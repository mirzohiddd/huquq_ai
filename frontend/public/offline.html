<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1a2744" />
  <title>Huquq AI — internet yo'q</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #22335a 0%, #0b1322 70%);
      color: #fff;
    }
    .card { max-width: 380px; }
    img { width: 84px; height: 84px; border-radius: 50%; margin-bottom: 20px; }
    h1 { font-size: 1.35rem; margin: 0 0 10px; }
    p { color: rgba(255,255,255,.7); line-height: 1.6; margin: 0 0 6px; font-size: .95rem; }
    button {
      margin-top: 22px; border: 0; border-radius: 10px; padding: 12px 26px;
      font-weight: 700; font-size: .95rem; cursor: pointer; color: #1a1a2e;
      background: linear-gradient(135deg, #c9953a, #b8770a);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo-192.png" alt="Huquq AI" />
    <h1>Internet aloqasi yo'q</h1>
    <p>Huquq AI ishlashi uchun internet kerak. Aloqani tekshirib, qayta urinib ko'ring.</p>
    <p>Нет подключения к интернету. Проверьте соединение и попробуйте снова.</p>
    <button type="button" onclick="location.reload()">Qayta urinish / Повторить</button>
  </div>
</body>
</html>
