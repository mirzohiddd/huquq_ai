        <h1>Huquq AI — O'zbekiston qonunchiligi bo'yicha AI huquqiy maslahatchi</h1>
        <p>
          Huquq AI — O'zbekiston qonunchiligiga asoslangan sun'iy intellekt
          huquqiy maslahat va ta'lim platformasi. Har bir javob lex.uz dagi
          amaldagi kodekslar va Konstitutsiya matnidan olinadi.
        </p>
        <h2>Platforma imkoniyatlari</h2>
        <ul>
          <li><strong>AI huquqiy maslahatchi</strong> — savolingizga qonun moddasiga tayangan javob.</li>
          <li><strong>Qonunlar kutubxonasi</strong> — O'zbekistonning amaldagi 20 ta kodeksi, ~6 950 modda.</li>
          <li><strong>Konstitutsiya</strong> — 155 modda, 6 bo'lim va 27 bob bo'yicha to'liq matn.</li>
          <li><strong>Huquqiy darslar</strong> — 124 ta dars va 6 ta kengaytirilgan darslik.</li>
          <li><strong>Testlar</strong> — har bir savolga izoh bilan.</li>
        </ul>
        <h2>Qamrab olingan sohalar</h2>
        <p>
          Mehnat, oila, meros, yer va ko'chmas mulk, iste'molchi, jinoyat,
